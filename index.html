<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paul Bendor-Samuel</title>
  <meta name="description" content="Apps by Paul Bendor-Samuel">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0a0a0a;
      --muted: #737373;
      --line: #e5e5e5;
      --accent: #2f4bff;
      --row-hover: #f5f6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #8a8a8a;
        --line: #262626;
        --accent: #7d8bff;
        --row-hover: #12142a;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 72px 0 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .tag { color: var(--muted); font-size: 0.8rem; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
    }

    h1 {
      margin: 96px 0 0;
      font-weight: 600;
      font-size: clamp(2.75rem, 10vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }
    h1 span { color: var(--muted); }

    .section-label {
      display: flex;
      justify-content: space-between;
      margin: 96px 0 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--fg);
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    ol { list-style: none; padding: 0; }
    a.app {
      display: grid;
      grid-template-columns: 3.5rem 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    a.app:hover { background: var(--row-hover); }
    a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .num { color: var(--muted); font-size: 0.8rem; }
    .text { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 24px; row-gap: 2px; }
    .name {
      font-size: clamp(1.6rem, 4.5vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      transition: color 0.15s ease;
    }
    .desc { color: var(--muted); font-size: 1rem; }
    .arrow {
      font-size: 1.5rem;
      color: var(--muted);
      transition: transform 0.2s ease, color 0.15s ease;
    }
    a.app:hover .name, a.app:hover .arrow { color: var(--accent); }
    a.app:hover .arrow { transform: translateX(6px); }

    footer {
      margin-top: auto;
      padding-top: 96px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      main { padding-top: 40px; }
      h1 { margin-top: 64px; }
      .section-label { margin-top: 64px; }
      a.app { grid-template-columns: 2rem 1fr auto; padding: 22px 0; }
      .text { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      a.app, .name, .arrow { transition: none; }
      a.app:hover .arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="tag mono"><span class="dot"></span>paulbendorsamuel.com</span>
      <span class="tag mono">✦</span>
    </header>

    <h1>Paul Bendor&#8209;Samuel<br><span>builds things.</span></h1>

    <div class="section-label mono"><span>Projects</span><span id="count"></span></div>

    <!-- To add or change an app, copy one <li> block below -->
    <ol>
      <li>
        <a class="app" href="https://holistic.paulbendorsamuel.com" target="_blank" rel="noopener">
          <span class="num mono"></span>
          <span class="text"><span class="name">Holistic</span><span class="desc">Holistic wellness tracking</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="app" href="https://pip.paulbendorsamuel.com" target="_blank" rel="noopener">
          <span class="num mono"></span>
          <span class="text"><span class="name">Pip</span><span class="desc">Product management interview prep</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="app" href="https://doubletake.paulbendorsamuel.com" target="_blank" rel="noopener">
          <span class="num mono"></span>
          <span class="text"><span class="name">Double Take</span><span class="desc">Virtual try-on</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="app" href="https://glimmer.paulbendorsamuel.com" target="_blank" rel="noopener">
          <span class="num mono"></span>
          <span class="text"><span class="name">Glimmer</span><span class="desc">Comedy and concert planning</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="app" href="https://overwatch.paulbendorsamuel.com" target="_blank" rel="noopener">
          <span class="num mono"></span>
          <span class="text"><span class="name">Overwatch</span><span class="desc">AI assistant</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ol>

    <footer class="mono">
      <span>© <span id="y"></span> Paul Bendor-Samuel</span>
    </footer>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const nums = document.querySelectorAll('.num');
    nums.forEach((el, i) => { el.textContent = String(i + 1).padStart(2, '0'); });
    document.getElementById('count').textContent = String(nums.length).padStart(2, '0');
  </script>
</body>
</html>
